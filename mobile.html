<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161826">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<title>Expense Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* ============================================================
   Expense Tracker — Nocturne (dark) mobile view
   Tokens lifted verbatim from the Claude Design "Nocturne"
   system (_ds/nocturne-169cf7e4.../styles.css). Layout follows
   the "Expense Tracker Mobile.dc.html" artboard 1:1.
   Data + AI wired to this repo's server: /api/data, /api/advice.
   ============================================================ */

:root {
  --color-bg: #161826;
  --color-surface: #232532;
  --color-surface-2: #1c1e2c;
  --color-surface-3: #1b1d2a;
  --color-text: #e9e9ed;
  --color-accent: #9184d9;

  --color-neutral-300: #cfd3e5;
  --color-neutral-400: #b2b6ca;
  --color-neutral-500: #9397ab;
  --color-neutral-600: #75798c;
  --color-neutral-700: #595d6c;
  --color-neutral-800: #3f424d;
  --color-neutral-900: #292b31;

  --color-accent-300: #d2cefd;
  --color-accent-400: #b5abfc;
  --color-accent-500: #968ae0;
  --color-accent-600: #796cbf;
  --color-accent-700: #5d5294;
  --color-accent-800: #423a6a;
  --color-accent-900: #2b2741;

  --line-16: rgba(233, 233, 237, .16);
  --line-12: rgba(233, 233, 237, .12);
  --line-10: rgba(233, 233, 237, .10);
  --line-08: rgba(233, 233, 237, .08);
  --line-07: rgba(233, 233, 237, .07);

  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 14px;
  --shadow-ring: 0 0 0 1px var(--color-neutral-800);

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* , *::before, *::after { box-sizing: border-box; }

html, body { margin: 0; height: 100%; }

body {
  background: #0e0f18;
  color: var(--color-text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  -webkit-tap-highlight-color: transparent;
}

button { font-family: inherit; color: inherit; }

::selection { background: rgba(145, 132, 217, .3); }

@keyframes noct-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes noct-rise { from { opacity: 0; transform: translateY(100%); } to { opacity: 1; transform: none; } }
@keyframes spin { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ---------- device shell -------------------------------------------------- */

.device {
  min-height: 100%;
  display: flex;
  align-items: stretch;
  justify-content: center;
  background:
    radial-gradient(1100px 520px at 50% -10%, #23253a, transparent 70%),
    #0e0f18;
}

.app {
  position: relative;
  width: 100%;
  max-width: 440px;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--color-bg);
  overflow: hidden;
}

@media (min-width: 480px) {
  .device { padding: 32px 16px; align-items: flex-start; }
  .app {
    height: min(900px, calc(100vh - 64px));
    max-height: min(900px, calc(100vh - 64px));
    border-radius: 40px;
    box-shadow:
      0 0 0 10px #0b0c14,
      0 0 0 12px #23253a,
      0 40px 90px rgba(0, 0, 0, .6);
  }
}

.app__scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding: calc(var(--safe-top) + 30px) 0 0;
}

.screen { padding: 0 18px calc(150px + var(--safe-bottom)); }
#screen.is-enter > .screen { animation: noct-fade .25s ease forwards; }

.boot {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-neutral-600);
  font-size: 13px;
  gap: 10px;
}

/* ---------- shared type ------------------------------------------------- */

.h-page { font-size: 22px; font-weight: 500; letter-spacing: -.02em; margin: 0; }
.tnum { font-variant-numeric: tabular-nums; }
.kicker { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-neutral-500); font-weight: 600; }

.link-btn {
  background: none; border: 0;
  color: var(--color-accent-400);
  font-size: 12.5px; font-weight: 500; cursor: pointer; padding: 2px 4px;
}

.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin: 22px 2px 10px;
}
.section-head .title { font-size: 15px; font-weight: 600; }

/* ---------- home: identity row ---------------------------------------- */

.identity {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 12px; margin-bottom: 18px;
}
.identity .hello { font-size: 13px; color: var(--color-neutral-500); }
.identity .name { font-size: 26px; font-weight: 500; letter-spacing: -.02em; line-height: 1.15; margin-top: 2px; }
.icon-btns { display: flex; gap: 8px; }
.icon-btn {
  width: 38px; height: 38px;
  border-radius: var(--radius-sm);
  background: var(--color-surface);
  border: 1px solid var(--line-16);
  color: var(--color-neutral-400);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; position: relative;
  transition: background .15s ease, color .15s ease;
  text-decoration: none;
}
.icon-btn:hover { background: #2b2741; color: var(--color-accent-400); }
.icon-btn .dot {
  position: absolute; top: 8px; right: 9px;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--color-accent-400);
}
.signin-pill {
  display: inline-flex; align-items: center; gap: 6px;
  height: 38px; padding: 0 13px;
  border-radius: var(--radius-sm);
  background: rgba(145, 132, 217, .16);
  border: 1px solid var(--color-accent);
  color: var(--color-accent-400);
  font-size: 12.5px; font-weight: 500;
  text-decoration: none;
}

/* ---------- balance card -------------------------------------------------- */

.balance-card {
  border-radius: var(--radius-lg);
  padding: 18px;
  background: linear-gradient(140deg, #2b2741 0%, #232532 55%, #1c1e2c 100%);
  box-shadow: 0 0 0 1px var(--color-neutral-800), 0 6px 18px rgba(0, 0, 0, .55);
  position: relative; overflow: hidden;
}
.balance-card::before {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(420px 160px at 88% -30%, rgba(145, 132, 217, .22), transparent 70%);
  pointer-events: none;
}
.balance-card__top {
  position: relative;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
}
.balance-card__amount {
  font-size: 34px; font-weight: 500; letter-spacing: -.02em; margin-top: 6px;
  background: none; border: 0; padding: 0; color: inherit; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
}
.balance-card__amount .eye { color: var(--color-neutral-500); display: flex; }
.balance-card__month { font-size: 12px; color: var(--color-neutral-400); margin-top: 4px; }

.round-add {
  width: 42px; height: 42px; border-radius: 50%;
  background: transparent; border: 1px solid var(--color-accent);
  color: var(--color-accent-400); cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: background .15s ease;
}
.round-add:hover { background: rgba(145, 132, 217, .14); }

.balance-card__stats {
  position: relative;
  display: flex; gap: 20px; margin-top: 16px; padding-top: 14px;
  border-top: 1px solid var(--line-12);
}
.balance-card__stats .k { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-neutral-500); font-weight: 600; }
.balance-card__stats .v { font-size: 15px; font-weight: 500; margin-top: 3px; }
.balance-card__stats .v.income { color: var(--color-accent-300); }

/* ---------- drawdown ---------------------------------------------------- */

.drawdown {
  margin-top: 14px; border-radius: var(--radius-lg); padding: 16px;
  background: var(--color-surface); box-shadow: var(--shadow-ring);
}
.drawdown__row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.drawdown__title { font-size: 13px; font-weight: 600; }
.drawdown__sub { font-size: 11.5px; color: var(--color-neutral-500); margin-top: 3px; }
.drawdown__pct { font-size: 26px; font-weight: 500; line-height: 1; color: var(--color-accent-400); }
.track {
  height: 10px; border-radius: 6px; background: var(--color-neutral-900);
  overflow: hidden; box-shadow: inset 0 0 0 1px var(--line-08);
}
.track__fill {
  height: 100%; border-radius: 6px;
  background: linear-gradient(90deg, #6b5fb5, #b5abfc);
  transition: width .6s cubic-bezier(.4, 0, .2, 1);
}

/* ---------- quick log grid ------------------------------------------------ */

.quicklog { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quicklog__card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 7px;
  padding: 13px; border-radius: var(--radius-md);
  background: var(--color-surface-2); border: 1px solid var(--line-08);
  cursor: pointer; text-align: left;
  transition: border-color .15s ease, background .15s ease;
}
.quicklog__card:hover { border-color: rgba(145, 132, 217, .4); background: #20222f; }
.quicklog__dot { width: 10px; height: 10px; border-radius: 3px; }
.quicklog__name { font-size: 13px; font-weight: 500; line-height: 1.25; }
.quicklog__total { font-size: 11.5px; color: var(--color-neutral-500); }

/* ---------- transaction rows ------------------------------------------- */

.txlist { display: flex; flex-direction: column; gap: 8px; }
.txrow {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 13px; border-radius: var(--radius-md);
  background: var(--color-surface-2); box-shadow: 0 0 0 1px var(--line-08);
}
.txrow__icon {
  width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600; color: var(--color-bg);
}
.txrow__body { flex: 1; min-width: 0; }
.txrow__desc { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.txrow__meta { font-size: 11.5px; color: var(--color-neutral-600); margin-top: 2px; }
.txrow__amt { font-size: 14px; font-weight: 500; flex-shrink: 0; }
.amt-in { color: var(--color-accent-400); }
.amt-out { color: var(--color-text); }

.empty-row {
  padding: 20px 14px; border-radius: var(--radius-md);
  background: var(--color-surface-2); box-shadow: 0 0 0 1px var(--line-08);
  font-size: 12.5px; color: var(--color-neutral-600); text-align: center;
}

/* ---------- overview: donut + bars ------------------------------------ */

.panel {
  border-radius: var(--radius-lg); padding: 20px 18px;
  background: linear-gradient(160deg, #232532, #1b1d2a); box-shadow: var(--shadow-ring);
}
.panel--plain { padding: 16px; background: var(--color-surface); }
.month-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 11px; border-radius: var(--radius-sm);
  background: var(--color-surface); box-shadow: 0 0 0 1px var(--line-16);
  font-size: 12.5px; color: var(--color-neutral-400);
}
.donut-wrap { display: flex; justify-content: center; }
.donut { position: relative; width: 212px; height: 212px; border-radius: 50%; }
.donut__hole {
  position: absolute; inset: 26px; border-radius: 50%;
  background: var(--color-surface-3);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: inset 0 0 0 1px rgba(233, 233, 237, .06);
}
.donut__value { font-size: 26px; font-weight: 500; }
.donut__label { font-size: 12px; color: var(--color-neutral-500); margin-top: 2px; }

.breakdown { display: grid; gap: 11px; margin-top: 20px; }
.breakdown__head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-size: 12.5px; margin-bottom: 5px;
}
.breakdown__name { display: flex; align-items: center; gap: 7px; font-weight: 500; }
.breakdown__dot { width: 9px; height: 9px; border-radius: 3px; }
.breakdown__val { color: var(--color-neutral-500); }
.bar { height: 6px; border-radius: 4px; background: var(--color-neutral-900); overflow: hidden; }
.bar__fill { height: 100%; border-radius: 4px; transition: width .5s ease; }

.spark { display: flex; align-items: flex-end; gap: 5px; height: 96px; }
.spark__col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
.spark__bar { border-radius: 3px 3px 2px 2px; }
.spark__axis {
  display: flex; justify-content: space-between;
  font-size: 10.5px; color: var(--color-neutral-600); margin-top: 8px;
}
.card-label { font-size: 13px; font-weight: 600; margin-bottom: 14px; }

.btn-outline {
  width: 100%; padding: 13px; border-radius: var(--radius-sm);
  background: transparent; border: 1px solid var(--color-accent);
  color: var(--color-accent-400); font-size: 14px; font-weight: 500; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background .15s ease;
}
.btn-outline:hover { background: rgba(145, 132, 217, .12); }

/* ---------- recon / ledger ------------------------------------------- */

.back-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.back-btn {
  width: 36px; height: 36px; border-radius: var(--radius-sm);
  background: var(--color-surface); border: 1px solid var(--line-16);
  color: var(--color-neutral-400); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.back-btn:hover { color: var(--color-accent-400); }

.recon-summary {
  border-radius: var(--radius-lg); padding: 18px;
  background: var(--color-surface); box-shadow: var(--shadow-ring);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.recon-summary .k { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-neutral-500); font-weight: 600; }
.recon-summary .v { font-size: 19px; font-weight: 500; margin-top: 4px; }
.recon-summary .v.close { color: var(--color-accent-400); }

.ledger {
  margin-top: 14px; border-radius: var(--radius-lg);
  background: var(--color-surface); box-shadow: var(--shadow-ring); overflow: hidden;
}
.ledger__head, .ledger__row { display: flex; gap: 10px; align-items: center; padding: 12px 14px; }
.ledger__head {
  padding: 11px 14px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--color-neutral-600); font-weight: 600;
  border-bottom: 1px solid var(--line-16);
}
.ledger__row { border-bottom: 1px solid var(--line-07); }
.ledger__row:last-child { border-bottom: 0; }
.ledger__entry { flex: 1; min-width: 0; }
.ledger__desc { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ledger__date { font-size: 11px; color: var(--color-neutral-600); margin-top: 2px; }
.ledger__amt { width: 78px; text-align: right; font-size: 12.5px; font-weight: 500; }
.ledger__run { width: 82px; text-align: right; font-size: 12.5px; color: var(--color-neutral-400); }
.col-amt { width: 78px; text-align: right; }
.col-run { width: 82px; text-align: right; }

/* ---------- wishlist ------------------------------------------------- */

.wish-sub { font-size: 12.5px; color: var(--color-neutral-500); margin-bottom: 18px; }
.wishlist { display: flex; flex-direction: column; gap: 9px; }
.wish { padding: 14px; border-radius: var(--radius-md); background: var(--color-surface-2); box-shadow: 0 0 0 1px var(--line-08); }
.wish.bought { opacity: .55; }
.wish__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.wish__name { font-size: 14px; font-weight: 500; }
.wish.bought .wish__name { text-decoration: line-through; color: var(--color-neutral-500); }
.wish__note { font-size: 11.5px; color: var(--color-neutral-600); margin-top: 3px; }
.wish__price { font-size: 15px; font-weight: 500; color: var(--color-accent-400); flex-shrink: 0; }
.wish__actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 11px; }
.badge { font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; }
.wish__act {
  padding: 6px 12px; border-radius: var(--radius-sm);
  background: transparent; border: 1px solid var(--color-accent);
  color: var(--color-accent-400); font-size: 12px; font-weight: 500; cursor: pointer;
}
.wish__act.restore { border-color: rgba(233, 233, 237, .2); color: var(--color-neutral-400); }

.note-card {
  margin-top: 16px; padding: 15px 16px; border-radius: var(--radius-md);
  background: var(--color-surface-2); box-shadow: 0 0 0 1px var(--line-08);
  font-size: 12.5px; color: var(--color-neutral-400); line-height: 1.55;
}

/* ---------- advisor ------------------------------------------------- */

.advisor-lede { font-size: 12.5px; color: var(--color-neutral-500); margin-bottom: 18px; line-height: 1.55; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  padding: 9px 13px; border-radius: var(--radius-sm);
  background: var(--color-surface); border: 1px solid var(--line-16);
  color: var(--color-neutral-400); font-size: 12.5px; font-weight: 500; cursor: pointer;
}
.chip.active { background: rgba(145, 132, 217, .16); border-color: var(--color-accent); color: var(--color-accent-400); }
.advice-box {
  margin-top: 18px; border-radius: var(--radius-lg); padding: 18px;
  background: var(--color-surface); box-shadow: var(--shadow-ring); min-height: 190px;
}
.advice-loading { display: flex; align-items: center; gap: 10px; color: var(--color-accent-400); font-size: 13px; font-weight: 500; }
.spinner {
  width: 16px; height: 16px; border-radius: 50%;
  border: 2px solid rgba(145, 132, 217, .3); border-top-color: var(--color-accent);
  display: inline-block; animation: spin .7s linear infinite;
}
.advice-title { display: flex; align-items: center; gap: 8px; color: var(--color-accent-400); font-size: 13px; font-weight: 600; margin-bottom: 10px; }
.advice-text { font-size: 13.5px; line-height: 1.7; color: #cfd3e5; white-space: pre-wrap; }
.advice-empty { text-align: center; padding: 34px 10px; color: var(--color-neutral-600); }
.advice-empty__glyph {
  width: 44px; height: 44px; margin: 0 auto 12px; border-radius: var(--radius-md);
  background: rgba(145, 132, 217, .12); box-shadow: 0 0 0 1px rgba(145, 132, 217, .28);
  display: flex; align-items: center; justify-content: center; color: var(--color-accent-400);
}

/* ---------- tab bar ------------------------------------------------- */

.tabbar {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 10px 14px calc(18px + var(--safe-bottom));
  background: linear-gradient(to top, rgba(22, 24, 38, .98) 40%, rgba(22, 24, 38, 0));
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.tabbar__inner {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px; border-radius: 16px; background: rgba(35, 37, 50, .9);
  box-shadow: 0 0 0 1px var(--line-10), 0 8px 24px rgba(0, 0, 0, .5);
}
.tab {
  flex: 1; min-width: 62px; height: 48px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  background: transparent; border: 1px solid transparent; border-radius: 11px;
  cursor: pointer; color: var(--color-neutral-600);
  transition: color .15s ease, background .15s ease;
}
.tab span { font-size: 10px; font-weight: 500; }
.tab.active { background: rgba(145, 132, 217, .16); border-color: rgba(145, 132, 217, .4); color: var(--color-accent-400); }
.tab-capture {
  width: 54px; height: 54px; border-radius: 50%; flex-shrink: 0; margin: -18px 4px 0;
  background: linear-gradient(150deg, #9184d9, #6b5fb5);
  border: 1px solid var(--color-accent-400); color: #f5f4ff; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 22px rgba(145, 132, 217, .35);
  transition: background .15s ease;
}
.tab-capture:hover { background: linear-gradient(150deg, #a396e6, #7a6dc4); }

/* ---------- capture sheet ------------------------------------------- */

.sheet-layer { position: absolute; inset: 0; z-index: 80; display: flex; flex-direction: column; justify-content: flex-end; }
.sheet-layer[hidden] { display: none; }
.sheet__scrim {
  position: absolute; inset: 0; background: rgba(10, 11, 18, .6);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
  border: 0; cursor: pointer;
}
.sheet {
  position: relative; border-radius: 18px 18px 0 0; background: var(--color-surface-2);
  box-shadow: 0 -1px 0 rgba(233, 233, 237, .14), 0 -20px 50px rgba(0, 0, 0, .6);
  padding: 16px 18px calc(30px + var(--safe-bottom));
  animation: noct-rise .28s cubic-bezier(.3, .9, .3, 1);
}
.sheet__grip { width: 44px; height: 4px; border-radius: 99px; background: rgba(233, 233, 237, .22); margin: 0 auto 14px; }
.sheet__head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sheet__title { font-size: 16px; font-weight: 600; }
.sheet__cancel { background: none; border: 0; color: var(--color-neutral-500); font-size: 12.5px; cursor: pointer; }

/* ---------- backend ---------------------------------------------- */

function persist(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* private mode / quota */ }
  if (state.online) {
    fetch('/api/data', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: key, value: value }),
    }).catch(function () { /* keep the local copy; retry on next change */ });
  }
}

function readLocal(key) {
  try {
    var v = JSON.parse(localStorage.getItem(key));
    return Array.isArray(v) ? v : null;
  } catch (e) { return null; }
}

function readLocalObj(key) {
  try {
    var v = JSON.parse(localStorage.getItem(key));
    return (v && typeof v === 'object' && !Array.isArray(v)) ? v : null;
  } catch (e) { return null; }
}

  if (!Array.isArray(list)) return null;
  var out = [];
  list.forEach(function (c) {
    if (!c || typeof c !== 'object') return;
    var name = String(c.name || '').trim();
    if (!name) return;
    if (out.some(function (x) { return x.name.toLowerCase() === name.toLowerCase(); })) return;
    var color = /^#[0-9a-fA-F]{6}$/.test(String(c.color || '')) ? c.color : '#9397ab';
    out.push({ name: name, color: color });
  });
  return out.length ? out : null;
}

function sanitizePrefs(obj) {
  var p = Object.assign({}, DEFAULT_PREFS);
  if (!obj || typeof obj !== 'object') return p;
  if (CURRENCIES.indexOf(obj.currency) >= 0) p.currency = obj.currency;
  var d = parseInt(obj.startDay, 10);
  if (d >= 1 && d <= 28) p.startDay = d;
  ['biometric', 'twoFactor', 'notify', 'privacy', 'drawdown'].forEach(function (k) {
    if (typeof obj[k] === 'boolean') p[k] = obj[k];
  });
  return p;
}

function persistCats() { persist(CATS_KEY, state.cats); }
function persistPrefs() { persist(PREFS_KEY, state.prefs); }

function setPref(key, value) {
  var prefs = Object.assign({}, state.prefs);
  prefs[key] = value;
  setState({ prefs: prefs });
  persistPrefs();
}

async function boot() {
  try {
    var me = await fetch('/api/me', { headers: { Accept: 'application/json' } });
    if (me.ok) {
      var who = await me.json();
      state.user = who.username || who.user || who.name || null;
      state.online = true;
    } else if (me.status === 401) {
      state.needsLogin = true;
    }
  } catch (e) { /* running without the backend — offline demo */ }

  var data = null;
  if (state.online) {
    try {
      var r = await fetch('/api/data', { headers: { Accept: 'application/json' } });
      if (r.ok) data = await r.json();
    } catch (e) { /* fall back to local */ }
  }
  if (!data) {
    data = {};
    data[EXP_KEY]   = readLocal(EXP_KEY);
    data[INC_KEY]   = readLocal(INC_KEY);
    data[WISH_KEY]  = readLocal(WISH_KEY);
    data[CATS_KEY]  = readLocal(CATS_KEY);
    data[PREFS_KEY] = readLocalObj(PREFS_KEY);
  }

  var expenses = Array.isArray(data[EXP_KEY])  ? data[EXP_KEY]  : [];
  var income   = Array.isArray(data[INC_KEY])  ? data[INC_KEY]  : [];
  var wish     = Array.isArray(data[WISH_KEY]) ? data[WISH_KEY] : [];

  if (!expenses.length && !income.length && !wish.length) {
    var s = seedData();
    expenses = s.expenses; income = s.income; wish = s.wish;
    state.demo = true;
  }

  state.expenses = expenses;
  state.income = income;
  state.wish = wish;
  state.cats = sanitizeCats(data[CATS_KEY]) || SEED_CATS.slice();
  state.prefs = sanitizePrefs(data[PREFS_KEY]);
  if (!catByName(state.cat)) state.cat = state.cats[0].name;
  state.monthKey = state.demo ? SEED_MONTH : new Date().toISOString().slice(0, 7);
  state.ready = true;
  render();
}

async function requestAdvice(key, prompt, ctx) {
  if (state.online) {
    try {
      var r = await fetch('/api/advice', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: prompt }),
      });
      if (r.ok) {
        var d = await r.json();
        var text = (d && (d.text || d.advice || d.message)) || '';
        return text.trim() || ADVICE[key](ctx);
      }
    } catch (e) { /* fall through */ }
  }
  return ADVICE[key](ctx);
}

/* ---------- helpers ------------------------------------------------ */

/* The currency preference swaps the symbol the app is denominated in; it does
   not convert historic amounts (nothing here knows an exchange rate). */
function curSym() { return CUR_SYM[state.prefs.currency] || CUR_SYM.GHS; }
function curName() { return CUR_NAME[state.prefs.currency] || CUR_NAME.GHS; }

function money(n) {
  return curSym() + Number(n || 0).toLocaleString('en-GB', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
/* Amount without the symbol — for the +/− ledger and transaction rows. */
function amountOnly(n) { return money(n).slice(curSym().length); }
function round2(n) { return Math.round((Number(n) + Number.EPSILON) * 100) / 100; }
function todayISO() { return new Date().toISOString().slice(0, 10); }

var MONTHS_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

function isoParts(iso) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
  return m ? { y: +m[1], mo: +m[2], d: +m[3] } : null;
}
function fmtDate(iso) {
  var p = isoParts(iso);
  if (!p) return String(iso || '');
  if (iso.slice(0, 10) === todayISO()) return 'Today';
  return p.d + ' ' + MONTHS_SHORT[p.mo - 1];
}
function monthLabel(mk) {
  var m = /^(\d{4})-(\d{2})/.exec(mk);
  return m ? MONTHS_LONG[+m[2] - 1] + ' ' + m[1] : mk;
}
function daysInMonth(mk) {
  var m = /^(\d{4})-(\d{2})/.exec(mk);
  return m ? new Date(+m[1], +m[2], 0).getDate() : 30;
}
var esc = function (s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
};
function catByName(name) {
  for (var i = 0; i < state.cats.length; i++) if (state.cats[i].name === name) return state.cats[i];
  return null;
}
function catColor(name) {
  var c = catByName(name);
  if (c) return c.color;
  // Deleted or unknown category — fall back to the muted neutral.
  return '#595d6c';
}

function flash(msg) {
  clearTimeout(toastTimer);
  state.toast = msg;
  paintToast();
  toastTimer = setTimeout(function () { state.toast = ''; paintToast(); }, 2200);
}

/* merged, month-scoped transaction list — the artboard's internal model */
function monthTxns() {
  var mk = state.monthKey;
  var out = [];
  state.income.forEach(function (i) {
    if (String(i.date || '').slice(0, 7) !== mk) return;
    out.push({ id: i.id, iso: i.date, date: fmtDate(i.date), desc: i.source || 'Income', cat: null, amount: +i.amount || 0, income: true });
  });
  state.expenses.forEach(function (e) {
    if (String(e.date || '').slice(0, 7) !== mk) return;
    out.push({ id: e.id, iso: e.date, date: fmtDate(e.date), desc: e.desc || e.category || 'Expense', cat: e.category, amount: +e.amount || 0, income: false });
  });
  out.sort(function (a, b) {
    if (a.iso < b.iso) return -1;
    if (a.iso > b.iso) return 1;
    return (a.id || 0) - (b.id || 0);
  });
  return out;
}

function derived() {
  var txns = monthTxns();
  var incSum = txns.filter(function (x) { return x.income; }).reduce(function (a, b) { return a + b.amount; }, 0);
  // Mirrors the artboard: fall back to a baseline monthly income when none is
  // logged (the design's `monthlyIncome` tweak, default ₵6,200).
  var income = incSum > 0 ? incSum : SEED_INCOME_FALLBACK;
  var spent = txns.filter(function (x) { return !x.income; }).reduce(function (a, b) { return a + b.amount; }, 0);
  var balance = income - spent;
  var pct = income ? Math.round((spent / income) * 100) : 0;
  var totals = {};
  state.cats.forEach(function (c) { totals[c.name] = 0; });
  txns.forEach(function (x) { if (!x.income) totals[x.cat] = (totals[x.cat] || 0) + x.amount; });
  return { txns: txns, income: income, spent: spent, balance: balance, pct: pct, totals: totals };
}

function priv(dots, full) { return state.prefs.privacy ? dots : full; }
function privAmt(full) { return state.prefs.privacy ? curSym() + ' ••••' : full; }

/* ---------- screen: Recon (ledger) ------------------------------------ */

function renderRecon() {
  var d = derived();

  // Running balance from the opening figure, oldest entry first, so the last
  // row equals the closing balance. (The source artboard accumulated
  // newest-first, which produced negative mid-statement balances.)
  var running = 0;
  var rows = d.txns.map(function (x) {
    running += x.income ? x.amount : -x.amount;
    var amt = (x.income ? '+' : '−') + amountOnly(x.amount);
    return '<div class="ledger__row">' +
      '<div class="ledger__entry">' +
        '<div class="ledger__desc">' + esc(x.desc) + '</div>' +
        '<div class="ledger__date">' + esc(x.date) + '</div>' +
      '</div>' +
      '<div class="ledger__amt tnum" style="color:' + (x.income ? '#b5abfc' : '#e9e9ed') + '">' + amt + '</div>' +
      '<div class="ledger__run tnum">' + money(running) + '</div>' +

  if (!d.txns.length) rows = '<div class="ledger__row"><div class="ledger__entry"><div class="ledger__date">No entries this month.</div></div></div>';

function initials(name) {
  var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '··';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function switchEl(key) {
  return '<button class="switch ' + (state.prefs[key] ? 'on' : '') + '" type="button" ' +

function pwScore() {
  var np = state.pw.next;
  return Math.min(4,
    (np.length >= 8 ? 1 : 0) +
    (np.length >= 12 ? 1 : 0) +
    (/\d/.test(np) ? 1 : 0) +
    (/[^A-Za-z0-9]/.test(np) ? 1 : 0));
}
function pwValid() {
  var np = state.pw.next;
  return np.length >= 8 && /\d/.test(np) && np === state.pw.confirm;
}

function renderSettingsPassword() {
  var np = state.pw.next;
  var score = pwScore();
  var label = !np ? 'Nothing yet' : ['Too weak', 'Weak', 'Fair', 'Good', 'Strong'][score];
  var color = !np ? '#75798c' : ['#595d6c', '#796cbf', '#968ae0', '#b5abfc', '#d2cefd'][score];

  var fields = [
    { key: 'current', label: 'Current password', ph: 'Enter current password' },
    { key: 'next',    label: 'New password',     ph: 'At least 8 characters' },
    { key: 'confirm', label: 'Confirm new password', ph: 'Repeat it' },
  ].map(function (f) {
    var mismatch = f.key === 'confirm' && state.pw.confirm && state.pw.confirm !== state.pw.next;
    return '<div>' +
      '<div class="pw-label">' + esc(f.label) + '</div>' +
      '<input class="pw-input ' + (mismatch ? 'mismatch' : '') + '" type="password" autocomplete="' +
        (f.key === 'current' ? 'current-password' : 'new-password') + '" ' +
        'data-field="pw-' + f.key + '" value="' + esc(state.pw[f.key]) + '" placeholder="' + esc(f.ph) + '" aria-label="' + esc(f.label) + '">' +
    '</div>';
  }).join('');

  var checks = [
    { label: 'Eight characters or more', ok: np.length >= 8 },
    { label: 'Contains a number', ok: /\d/.test(np) },
    { label: 'Both new entries match', ok: !!np && np === state.pw.confirm },
  ].map(function (c) {
    return '<div class="pw-check ' + (c.ok ? 'ok' : '') + '">' +
      '<span class="mark">' + (c.ok ? '✓' : '·') + '</span>' +
      '<span class="txt">' + esc(c.label) + '</span>' +
    '</div>';
  }).join('');

  var ready = pwValid() && !!state.pw.current && !state.pwBusy;

  var note = state.pwUnsupported
    ? '<div class="pw-note">This build of the server has no password-change endpoint yet, so the change could not be saved. ' +
      'Everything else on this screen is live — ask for <code>/api/password</code> to be added and this form will start working.</div>'
    : '';

  return '<div class="set-lede">Eight characters or more, with at least one number. You will stay signed in on this device.</div>' +
    '<div class="pw-fields">' + fields + '</div>' +
    '<div class="pw-strength">' +
      '<div class="pw-strength__head">' +
        '<span class="lbl">Strength</span>' +
        '<span style="font-weight:600;color:' + color + '">' + esc(label) + '</span>' +
      '</div>' +
      '<div class="track" style="height:6px;border-radius:4px;box-shadow:none">' +
        '<div style="height:100%;border-radius:4px;transition:width .3s ease;width:' + (score * 25) + '%;background:' + color + '"></div>' +
      '</div>' +
    '</div>' +
    '<div class="pw-checks">' + checks + '</div>' +
    '<button class="btn-pw ' + (ready ? 'ready' : '') + '" type="button" data-act="pw-save">' +
      (state.pwBusy ? 'Updating…' : 'Update password') + '</button>' +
    '<button class="btn-link" type="button" data-act="pw-forgot">Forgot current password?</button>' +
    note;
}

        '<div class="sub">' + esc(curName()) + ' · today</div>' +
      '</div>' +
      '<div class="sheet__cats">' + cats + '</div>' +
      '<div class="keypad">' + keys + '</div>' +
      '<button class="sheet__commit ' + (ready ? 'ready' : '') + '" type="button" data-act="commit">' + esc(commitLabel) + '</button>' +
    '</div>';
}

/* ---------- toast --------------------------------------------- */

function paintToast() {
  var layer = document.getElementById('toastLayer');
  layer.innerHTML = state.toast ? '<div class="toast">' + esc(state.toast) + '</div>' : '';
}

/* ---------- render ------------------------------------------- */

var SCREENS = {
  home: renderHome,
  insights: renderOverview,
  ledger: renderRecon,
  wishlist: renderWishlist,
  advisor: renderAdvisor,
  settings: renderSettings,
};

function displayName() {
  if (!state.user) return 'G. Lartey';
  return String(state.user).replace(/[._-]+/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
}

function render() {
  var screen = document.getElementById('screen');
  var tabbar = document.getElementById('tabbar');

  if (!state.ready) {
    screen.innerHTML = '<div class="boot"><span class="spinner"></span> Loading…</div>';
    tabbar.hidden = true;
    return;
  }

  // Settings sub-views behave like their own screens (fade + scroll to top).
  var viewKey = state.tab + (state.tab === 'settings' ? ':' + state.sview : '');
  var viewChanged = screen.dataset.view !== viewKey;

  // A full innerHTML swap drops focus, caret and scroll. Screens now carry
  // text inputs that re-render on every keystroke, so capture and restore.
  var active = document.activeElement;
  var keepField = (!viewChanged && active && active.dataset && active.dataset.field) ? {
    field: active.dataset.field,
    start: active.selectionStart,
    end: active.selectionEnd,
  } : null;
  var keepScroll = viewChanged ? 0 : screen.scrollTop;

  screen.dataset.view = viewKey;
  screen.dataset.tab = state.tab;
  screen.innerHTML = (SCREENS[state.tab] || renderHome)();
  screen.classList.remove('is-enter');
  if (viewChanged) {
    void screen.offsetWidth;
    screen.classList.add('is-enter');
  }
  screen.scrollTop = keepScroll;

  if (keepField) {
    var el = screen.querySelector('[data-field="' + keepField.field + '"]');
    if (el) {
      el.focus({ preventScroll: true });
      try { el.setSelectionRange(keepField.start, keepField.end); } catch (e) { /* type without selection support */ }
    }
  }

  tabbar.hidden = false;
  tabbar.innerHTML = renderTabbar();

  var sheetLayer = document.getElementById('sheetLayer');
  sheetLayer.hidden = !state.sheet;
  sheetLayer.innerHTML = renderSheet();

  paintToast();
}

/* ---------- actions ---------------------------------------- */

function go(tab) { setState({ tab: tab }); }

function openSheet(cat) {
  var patch = { sheet: true, draft: '' };
  if (cat) patch.cat = cat;
  setState(patch);
}
function closeSheet() { setState({ sheet: false }); }

function pressKey(k) {
  var dr = state.draft;
  if (k === '⌫') dr = dr.slice(0, -1);
  else if (k === '.') { if (dr.indexOf('.') < 0) dr = (dr || '0') + '.'; }
  else if (!(dr.indexOf('.') >= 0 && dr.split('.')[1].length >= 2)) dr = (dr === '0' ? '' : dr) + k;
  setState({ draft: dr });
}

function commit() {
  var v = parseFloat(state.draft);
  if (!(v > 0)) return;
  var e = { id: Date.now(), date: todayISO(), amount: round2(v), category: state.cat, desc: state.cat + ' — quick entry' };
  var expenses = state.expenses.concat([e]);
  setState({ expenses: expenses, sheet: false, draft: '' });
  persist(EXP_KEY, expenses);
  flash(money(v) + ' logged to ' + state.cat);
}

function toggleWish(i) {
  var w = state.wish[i];
  if (!w) return;
  var nowBought = !w.bought;
  var wish = state.wish.map(function (x, j) {
    return j === i ? Object.assign({}, x, { bought: nowBought, boughtDate: nowBought ? todayISO() : null }) : x;
  });
  var expenses = state.expenses;
  if (nowBought) {
    expenses = state.expenses.concat([{
      id: Date.now(), date: todayISO(), amount: round2(w.price),
      category: 'Shopping', desc: w.name, fromWish: w.id,
    }]);
  } else {
    expenses = state.expenses.filter(function (e) { return e.fromWish !== w.id; });
  }
  setState({ wish: wish, expenses: expenses });
  persist(WISH_KEY, wish);
  persist(EXP_KEY, expenses);
  flash(nowBought ? 'Bought — logged as Shopping' : 'Back on the wishlist');
}

function buildPrompt(key, d, pendingWish) {
  var lines = [];
  lines.push('I track my personal money in ' + curName() + ' (' + curSym() + '). Please act as my financial advisor for someone living in Ghana.');
  lines.push('');
  lines.push('My ' + monthLabel(state.monthKey) + ' so far:');
  lines.push('- Income: ' + money(d.income));
  lines.push('- Spent: ' + money(d.spent) + ' (' + d.pct + '% of income)');
  lines.push('- Balance: ' + money(d.balance));
  lines.push('- Entries logged: ' + d.txns.length);
  lines.push('- By category: ' + state.cats.map(function (c) { return c.name + ' ' + money(d.totals[c.name]); }).join('; '));
  if (pendingWish.length) {
    lines.push('- Wishlist still to buy: ' + pendingWish.map(function (w) { return w.name + ' ' + money(w.price) + ' (' + w.priority + ')'; }).join('; '));
  }
  lines.push('');
  lines.push('Question: ' + key);
  lines.push('');
  lines.push('Answer in 2-3 short paragraphs, specific and practical, with cedi amounts. No preamble.');
  return lines.join('\n');
}

async function askAdvice(key) {
  clearTimeout(adviceTimer);
  var d = derived();
  var totals = d.totals;
  var top = state.cats.slice().sort(function (a, b) { return totals[b.name] - totals[a.name]; })[0];
  var pendingWish = state.wish.filter(function (w) { return !w.bought; });
  var ctx = {
    monthName: MONTHS_LONG[(isoParts(state.monthKey + '-01') || { mo: 1 }).mo - 1],
    income: money(d.income), spent: money(d.spent), balance: money(d.balance), pct: d.pct,
    topCat: top.name, topAmount: money(totals[top.name]),
    food: money(totals['Food & Transport']),
    foodPerDay: money(totals['Food & Transport'] / Math.max(1, new Date().getDate())),
    shopping: money(totals['Shopping']),
  };

  setState({ loading: true, advice: null, adviceKey: key });

  var prompt = buildPrompt(key, d, pendingWish);
  var minSpin = new Promise(function (res) { adviceTimer = setTimeout(res, 650); });
  var text = await requestAdvice(key, prompt, ctx);
  await minSpin;
  if (state.adviceKey === key) setState({ loading: false, advice: text });
}

/* ---------- settings actions ----------------------------- */

function openSettings() { setState({ tab: 'settings', sview: 'root', editCat: -1 }); }

function settingsBack() {
  if (state.sview === 'root') return setState({ tab: 'home' });
  setState({ sview: 'root', editCat: -1 });
}

function bumpDay(delta) {
  setPref('startDay', Math.max(1, Math.min(28, state.prefs.startDay + delta)));
}

function catEdit(i) {
  var c = state.cats[i];
  if (!c) return;
  setState({ editCat: i, editDraft: { name: c.name, color: c.color } });
}

function catSave() {
  var i = state.editCat;
  var old = state.cats[i];
  if (!old) return;
  var name = state.editDraft.name.trim();
  if (!name) { flash('Give the category a name'); return; }
  var clash = state.cats.some(function (c, j) {
    return j !== i && c.name.toLowerCase() === name.toLowerCase();
  });
  if (clash) { flash('That category already exists'); return; }

  var cats = state.cats.map(function (c, j) {
    return j === i ? { name: name, color: state.editDraft.color } : c;
  });
  // Renaming carries every entry with it, so totals follow the name.
  var renamed = name !== old.name;
  var expenses = renamed ? state.expenses.map(function (e) {
    return e.category === old.name ? Object.assign({}, e, { category: name }) : e;
  }) : state.expenses;

  setState({
    cats: cats,
    expenses: expenses,
    editCat: -1,
    cat: state.cat === old.name ? name : state.cat,
  });
  persistCats();
  if (renamed) persist(EXP_KEY, expenses);
  flash('Category saved');
}

function catRemove(i) {
  var c = state.cats[i];
  if (!c) return;
  if (state.cats.length <= 2) { flash('Keep at least two categories'); return; }
  var used = state.expenses.filter(function (e) { return e.category === c.name; }).length;
  if (used) { flash(used + ' entries use this — reassign them first'); return; }
  var cats = state.cats.filter(function (x, j) { return j !== i; });
  setState({ cats: cats, editCat: -1, cat: state.cat === c.name ? cats[0].name : state.cat });
  persistCats();
  flash(c.name + ' removed');
}

function catAdd() {
  var name = state.newCat.name.trim();
  if (!name) return;
  if (state.cats.some(function (c) { return c.name.toLowerCase() === name.toLowerCase(); })) {
    flash('That category already exists');
    return;
  }
  var cats = state.cats.concat([{ name: name, color: state.newCat.color }]);
  setState({ cats: cats, newCat: { name: '', color: '#b5abfc' } });
  persistCats();
  flash(name + ' added');
}

function csvCell(v) {
  var s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCSV() {
  var d = derived();
  if (!d.txns.length) { flash('Nothing to export this month'); return; }
  var rows = [['Date', 'Type', 'Category', 'Description', 'Amount', 'Currency']];
  d.txns.forEach(function (x) {
    rows.push([
      x.iso, x.income ? 'Income' : 'Expense', x.income ? '' : (x.cat || ''),
      x.desc, round2(x.amount).toFixed(2), state.prefs.currency,
    ]);
  });
  var csv = rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
  var name = 'expenses-' + state.monthKey + '.csv';

  // Inside the Android shell a blob download is silently ignored, so hand the
  // file to the app and let it open the system share sheet instead.
  if (window.AppExport && typeof window.AppExport.postMessage === 'function') {
    try {
      window.AppExport.postMessage(JSON.stringify({ name: name, csv: '﻿' + csv }));
      flash(d.txns.length + ' entries ready to save');
      return;
    } catch (e) { /* fall through to the browser path */ }
  }

  try {
    var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  } catch (e) { /* download blocked — the toast still lands */ }
  flash(d.txns.length + ' entries exported as CSV');
}

/* ---------- backup / restore ---------------------------------- */

var BACKUP_FORMAT = 1;

function buildBackup() {
  return {
    app: 'expense-tracker',
    format: BACKUP_FORMAT,
    exportedAt: new Date().toISOString(),
    expenses: state.expenses,
    income: state.income,
    wishlist: state.wish,
    categories: state.cats,
    prefs: state.prefs,
  };
}

function exportBackup() {
  var json = JSON.stringify(buildBackup(), null, 2);
  var name = 'expense-tracker-backup-' + todayISO() + '.json';
  if (window.AppExport && typeof window.AppExport.postMessage === 'function') {
    try {
      window.AppExport.postMessage(JSON.stringify({ name: name, csv: json }));
      flash('Backup ready to save');
      return;
    } catch (e) { /* fall through */ }
  }
  try {
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  } catch (e) { /* download blocked */ }
  flash('Backup exported');
}

/* Fresh ids that can't collide with anything already here. */
function idMaker(existing) {
  var next = Date.now();
  return function () {
    while (existing[next]) next++;
    existing[next] = true;
    return next++;
  };
}

function norm(v) { return String(v == null ? '' : v).trim().toLowerCase(); }

/* Merge a backup in, skipping anything that already looks present. Never
   deletes; running the same file twice is a no-op. */
function mergeBackup(b) {
  var rep = {
    expenses: 0, income: 0, wishlist: 0, categories: 0,
    skipped: 0, prefsSkipped: false,
  };

  var cats = state.cats.slice();
  var catNames = {};
  cats.forEach(function (c) { catNames[norm(c.name)] = true; });
  (Array.isArray(b.categories) ? b.categories : []).forEach(function (c) {
    if (!c || !c.name) return;
    if (catNames[norm(c.name)]) return;
    var color = /^#[0-9a-fA-F]{6}$/.test(String(c.color || '')) ? c.color : '#9397ab';
    cats.push({ name: String(c.name).trim(), color: color });
    catNames[norm(c.name)] = true;
    rep.categories++;
  });

  var usedIds = {};
  state.expenses.forEach(function (e) { usedIds[e.id] = true; });
  state.income.forEach(function (i) { usedIds[i.id] = true; });
  state.wish.forEach(function (w) { usedIds[w.id] = true; });
  var nextId = idMaker(usedIds);

  // Wishlist first: expenses may point at wish ids, which get remapped.
  var wish = state.wish.slice();
  var wishKeys = {};
  wish.forEach(function (w) { wishKeys[norm(w.name) + '|' + (+w.price || 0)] = true; });
  var wishIdMap = {};
  (Array.isArray(b.wishlist) ? b.wishlist : []).forEach(function (w) {
    if (!w || !w.name) return;
    var key = norm(w.name) + '|' + (+w.price || 0);
    if (wishKeys[key]) { rep.skipped++; return; }
    var id = nextId();
    if (w.id != null) wishIdMap[w.id] = id;
    wish.push({
      id: id, name: String(w.name), price: +w.price || 0,
      priority: w.priority || 'Medium', notes: w.notes || '',
      bought: !!w.bought, boughtDate: w.boughtDate || null,
    });
    wishKeys[key] = true;
    rep.wishlist++;
  });

  var expenses = state.expenses.slice();
  var expKeys = {};
  expenses.forEach(function (e) {
    expKeys[e.date + '|' + (+e.amount || 0) + '|' + norm(e.category) + '|' + norm(e.desc)] = true;
  });
  (Array.isArray(b.expenses) ? b.expenses : []).forEach(function (e) {
    if (!e || !e.date) return;
    var key = e.date + '|' + (+e.amount || 0) + '|' + norm(e.category) + '|' + norm(e.desc);
    if (expKeys[key]) { rep.skipped++; return; }
    var row = {
      id: nextId(), date: String(e.date), amount: round2(+e.amount || 0),
      category: e.category || 'Miscellaneous', desc: e.desc || '',
    };
    // Keep the wishlist link pointing at the item we actually imported.
    if (e.fromWish != null && wishIdMap[e.fromWish] != null) row.fromWish = wishIdMap[e.fromWish];
    expenses.push(row);
    expKeys[key] = true;
    rep.expenses++;
  });

  var income = state.income.slice();
  var incKeys = {};
  income.forEach(function (i) { incKeys[i.date + '|' + (+i.amount || 0) + '|' + norm(i.source)] = true; });
  (Array.isArray(b.income) ? b.income : []).forEach(function (i) {
    if (!i || !i.date) return;
    var key = i.date + '|' + (+i.amount || 0) + '|' + norm(i.source);
    if (incKeys[key]) { rep.skipped++; return; }
    income.push({ id: nextId(), date: String(i.date), amount: round2(+i.amount || 0), source: i.source || 'Income' });
    incKeys[key] = true;
    rep.income++;
  });

  // Preferences stay device-local — silently changing someone's currency or
  // toggles on import would be a surprise.
  if (b.prefs && typeof b.prefs === 'object') rep.prefsSkipped = true;

  setState({ cats: cats, wish: wish, expenses: expenses, income: income, importReport: rep });
  if (rep.categories) persistCats();
  if (rep.wishlist) persist(WISH_KEY, wish);
  if (rep.expenses) persist(EXP_KEY, expenses);
  if (rep.income) persist(INC_KEY, income);
  return rep;
}

function runImport(text) {
  var b;
  try {
    b = JSON.parse(text);
  } catch (e) {
    setState({ importReport: { error: 'That file is not valid JSON.' } });
    return;
  }
  if (!b || typeof b !== 'object' || Array.isArray(b)) {
    setState({ importReport: { error: 'That file is not an Expense Tracker backup.' } });
    return;
  }
  if (b.app && b.app !== 'expense-tracker') {
    setState({ importReport: { error: 'That backup is from a different app (' + esc(String(b.app)).slice(0, 30) + ').' } });
    return;
  }
  var hasAny = ['expenses', 'income', 'wishlist', 'categories'].some(function (k) { return Array.isArray(b[k]); });
  if (!hasAny) {
    setState({ importReport: { error: 'No expenses, income, wishlist or categories found in that file.' } });
    return;
  }
  var rep = mergeBackup(b);
  var total = rep.expenses + rep.income + rep.wishlist + rep.categories;
  flash(total ? 'Imported ' + total + ' new ' + (total === 1 ? 'item' : 'items') : 'Nothing new to import');
}

function pickBackupFile() {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.addEventListener('change', function () {
    var f = input.files && input.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () { runImport(String(reader.result || '')); };
    reader.onerror = function () { setState({ importReport: { error: 'Could not read that file.' } }); };
    reader.readAsText(f);
  });
  input.click();
}

async function signOut() {
  try { await fetch('/api/logout', { method: 'POST' }); } catch (e) { /* offline */ }
  location.href = LOGIN_URL;
}

async function savePassword() {
  if (state.pwBusy) return;
  if (!state.pw.current) { flash('Enter your current password'); return; }
  if (!pwValid()) { flash('New password does not meet the rules'); return; }
  if (!state.online) { flash('Sign in to change your password'); return; }

  setState({ pwBusy: true });
  var ok = false, msg = 'Could not update the password';
  try {
    var r = await fetch('/api/password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ current: state.pw.current, next: state.pw.next }),
    });
    if (r.ok) {
      ok = true;
    } else if (r.status === 404) {
      // The server in this repo has no password endpoint yet — say so plainly
      // rather than pretending the change landed.
      setState({ pwUnsupported: true });
      msg = 'The server has no password endpoint yet';
    } else {
      var body = null;
      try { body = await r.json(); } catch (e) { /* non-JSON error */ }
      msg = (body && body.error) || (r.status === 401 ? 'Current password is wrong' : msg);
    }
  } catch (e) {
    msg = 'Could not reach the server';
  }

  if (ok) {
    setState({ pwBusy: false, pw: { current: '', next: '', confirm: '' }, sview: 'root', pwUpdated: true, pwUnsupported: false });
    flash('Password updated');
  } else {
    setState({ pwBusy: false });
    flash(msg);
  }
}

/* ---------- event wiring (delegated) --------------------- */

var CLICK_SEL = '[data-go],[data-act],[data-quick],[data-wish],[data-advice],[data-key],' +
  '[data-sheetcat],[data-toggle],[data-cur],[data-day],[data-catedit],[data-catdel],' +
  '[data-editcolor],[data-newcolor]';

document.getElementById('app').addEventListener('click', function (e) {
  var t = e.target.closest(CLICK_SEL);
  if (!t) return;

  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.quick != null) return openSheet((state.cats[+t.dataset.quick] || {}).name);
  if (t.dataset.wish != null) return toggleWish(+t.dataset.wish);
  if (t.dataset.advice) return askAdvice(t.dataset.advice);
  if (t.dataset.key) return pressKey(t.dataset.key);
  if (t.dataset.sheetcat) return setState({ cat: t.dataset.sheetcat });

  /* settings */
  if (t.dataset.toggle) return setPref(t.dataset.toggle, !state.prefs[t.dataset.toggle]);
  if (t.dataset.cur) return setPref('currency', t.dataset.cur);
  if (t.dataset.day) return bumpDay(+t.dataset.day);
  if (t.dataset.catedit != null) return catEdit(+t.dataset.catedit);
  if (t.dataset.catdel != null) return catRemove(+t.dataset.catdel);
  if (t.dataset.editcolor) return setState({ editDraft: Object.assign({}, state.editDraft, { color: t.dataset.editcolor }) });
  if (t.dataset.newcolor) return setState({ newCat: Object.assign({}, state.newCat, { color: t.dataset.newcolor }) });

  switch (t.dataset.act) {
    case 'open-sheet': return openSheet();
    case 'close-sheet': return closeSheet();
    case 'commit': return commit();
    case 'privacy': return setPref('privacy', !state.prefs.privacy);

    case 'settings': return openSettings();
    case 'settings-back': return settingsBack();
    case 'go-cats': return setState({ sview: 'cats', editCat: -1 });
    case 'go-password': return setState({ sview: 'password', pw: { current: '', next: '', confirm: '' } });
    case 'cat-save': return catSave();
    case 'cat-cancel': return setState({ editCat: -1 });
    case 'cat-add': return catAdd();
    case 'export': return exportCSV();
    case 'export-backup': return exportBackup();
    case 'go-import': return setState({ sview: 'import', importReport: null, importText: '' });
    case 'pick-backup': return pickBackupFile();
    case 'import-paste': return state.importText.trim() ? runImport(state.importText) : flash('Paste a backup first');
    case 'signout': return signOut();
    case 'pw-save': return savePassword();
    case 'pw-forgot': return flash('Password reset is not set up on this server yet');
    case 'edit-profile': return flash('Profile editing is not available yet');
    case 'delete-account': return flash('Account deletion is not available from the app');
  }
});

/* Text fields live inside the re-rendered screen; keep state in step as the
   user types (render() restores focus and caret). */
document.getElementById('app').addEventListener('input', function (e) {
  var f = e.target.dataset ? e.target.dataset.field : null;
  if (!f) return;
  var v = e.target.value;
  if (f === 'catname') return setState({ editDraft: Object.assign({}, state.editDraft, { name: v }) });
  if (f === 'newcat') return setState({ newCat: Object.assign({}, state.newCat, { name: v }) });
  if (f === 'importText') return setState({ importText: v });
  if (f.indexOf('pw-') === 0) {
    var patch = Object.assign({}, state.pw);
    patch[f.slice(3)] = v;
    return setState({ pw: patch });
  }
});

document.addEventListener('keydown', function (e) {
  if (state.sheet) {
    if (e.key === 'Escape') { closeSheet(); return; }
    if (e.key === 'Enter') { commit(); return; }
    if (/^[0-9.]$/.test(e.key)) { pressKey(e.key); return; }
    if (e.key === 'Backspace') { pressKey('⌫'); }
    return;
  }

  if (state.tab !== 'settings') return;
  var f = e.target && e.target.dataset ? e.target.dataset.field : null;
  if (e.key === 'Escape') { settingsBack(); return; }
  if (e.key !== 'Enter' || !f) return;
  e.preventDefault();
  if (f === 'catname') return catSave();
  if (f === 'newcat') return catAdd();
  if (f.indexOf('pw-') === 0) return savePassword();
});

/* ---------- boot ---------------------------------------- */

render();
boot();
</script>
</body>
